        align-items: center;
        height: 100vh;
        margin: 0;
        background: #ddd;
    }

    .chessboard {
        display: grid;
        grid-template-columns: repeat(8, 60px);
        grid-template-rows: repeat(8, 60px);
        border: 4px solid #333;
    }

    .square {
        width: 60px;
        height: 60px;
    }

    .white {

    }

    .black {

</style>
